<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tweakunits Encoder</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #fff;
      }
      .container {
        display: flex;
        gap: 16px;
        flex: 1;
        min-height: 0;
      }
      .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #aaa;
      }
      textarea {
        flex: 1;
        width: 100%;
        background: #252525;
        border: 1px solid #444;
        border-radius: 6px;
        color: #e0e0e0;
        font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, monospace;
        font-size: 13px;
        line-height: 1.5;
        padding: 12px;
        resize: none;
        outline: none;
      }
      textarea:focus {
        border-color: #666;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #2563eb;
      }
      button.secondary {
        background: #333;
      }
      button.secondary:hover {
        background: #444;
      }
      .hint {
        font-size: 0.75rem;
        color: #777;
      }
    </style>
  </head>
  <body>
    <h1>Tweakunits Encoder</h1>
    <div class="container">
      <div class="panel">
        <label>Input (JSON / table)</label>
        <textarea
          id="input"
          placeholder="Paste your text here...
{
  armaak = {
    unitrestricted = 0,
  },
}"
        ></textarea>
      </div>
      <div class="panel">
        <label>Output</label>
        <textarea id="output" readonly placeholder="!bset tweakunits ..."></textarea>
      </div>
    </div>
    <div class="controls">
      <button onclick="encode()">Encode</button>
      <button class="secondary" onclick="copyOutput()">Copy Output</button>
      <button class="secondary" onclick="clearAll()">Clear</button>
      <span class="hint">Live encode as you type · = becomes _</span>
    </div>

    <script>
      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");

      function toBase64WithUnderscore(str) {
        // Encode to standard Base64 then replace padding = with _
        const b64 = btoa(unescape(encodeURIComponent(str)));
        return b64.replace(/=/g, "_");
      }

      function encode() {
        const text = inputEl.value;
        if (!text.trim()) {
          outputEl.value = "";
          return;
        }
        const encoded = toBase64WithUnderscore(text);
        outputEl.value = "!bset tweakunits " + encoded;
      }

      function copyOutput() {
        if (!outputEl.value) return;
        navigator.clipboard.writeText(outputEl.value).then(() => {
          const btn = event.target;
          const original = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = original), 1200);
        });
      }

      function clearAll() {
        inputEl.value = "";
        outputEl.value = "";
        inputEl.focus();
      }

      // Live encode on input
      inputEl.addEventListener("input", encode);

      // Initial example
      inputEl.value = `{
  armaak = {
    unitrestricted = 0,
  },
}`;
      encode();
    </script>
  </body>
</html>
